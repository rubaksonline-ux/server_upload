<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Просмотр файла</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background: #f8f9fa; padding: 3rem 0; }
    .file-card { max-width: 650px; margin: 0 auto; }
    .preview-box { background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; min-height: 200px; display: flex; align-items: center; justify-content: center; }
    .preview-box img, .preview-box video { max-width: 100%; max-height: 400px; object-fit: contain; }
    .meta-grid { background: #fff; padding: 1rem; border-radius: 8px; }
    .meta-grid .row > div { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loader" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">Загрузка данных...</p></div>
    
    <div id="content" class="card file-card shadow d-none">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">📁 <span id="fileName"></span></h5>
        <a id="downloadBtn" href="#" class="btn btn-light btn-sm fw-bold">⬇️ Скачать</a>
      </div>
      <div class="card-body">
        <div id="previewContainer" class="preview-box"></div>
        <div class="meta-grid">
          <div class="row">
            <div class="col-5 text-muted">📅 Загружен:</div><div class="col-7 fw-bold" id="date"></div>
            <div class="col-5 text-muted">📐 Размер:</div><div class="col-7 fw-bold" id="size"></div>
            <div class="col-5 text-muted">👁 Скачиваний:</div><div class="col-7 fw-bold" id="downloads"></div>
            <div class="col-5 text-muted">👤 Владелец:</div><div class="col-7 fw-bold" id="owner"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="error" class="alert alert-danger d-none text-center"></div>
  </div>

  <script>
    const slug = window.location.pathname.split('/').pop();
    async function init() {
      try {
        const res = await fetch(`/api/files/${slug}`);
        if (!res.ok) throw new Error('Файл не найден или удалён');
        const f = await res.json();
        
        document.getElementById('fileName').textContent = f.original_name;
        document.getElementById('date').textContent = new Date(f.uploaded_at).toLocaleString('ru-RU');
        document.getElementById('size').textContent = `${(f.size / 1024 / 1024).toFixed(2)} MB`;
        document.getElementById('downloads').textContent = f.download_count;
        document.getElementById('owner').textContent = f.owner;
        document.getElementById('downloadBtn').href = `/Video/${f.friendly_name}`;
        
        const ext = f.friendly_name.split('.').pop().toLowerCase();
        const src = `/Video/${f.friendly_name}`;
        const box = document.getElementById('previewContainer');
        
        if (['mp4','webm','mov'].includes(ext)) box.innerHTML = `<video controls src="${src}"></video>`;
        else if (['png','jpg','jpeg','webp'].includes(ext)) box.innerHTML = `<img src="${src}" />`;
        else box.innerHTML = `<div class="text-white fs-1">📄 Файл</div>`;

        document.getElementById('loader').classList.add('d-none');
        document.getElementById('content').classList.remove('d-none');
      } catch (err) {
        document.getElementById('loader').classList.add('d-none');
        document.getElementById('error').classList.remove('d-none');
        document.getElementById('error').textContent = err.message;
      }
    }
    init();
  </script>
</body>
</html>
